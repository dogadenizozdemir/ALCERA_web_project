services:
  db:
    image: postgres:16
    container_name: alcera-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - alcera_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  alcera_data: