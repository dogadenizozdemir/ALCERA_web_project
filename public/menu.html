<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>Menu | ALCÉRA</title>
  
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<header id="site-header"></header>
  
<main>
    
<section class="section">
      
<div class="container section-title">
        
<h1>Our Menu</h1>
        
<p>Carefully prepared flavours, within reach.</p>
      
</div>
      
<div class="container">
        
<div class="menu-categories">
          
<button class="btn btn--primary" data-category="all">All</button>
          
<button class="btn" data-category="starters">Starters</button>
          
<button class="btn" data-category="main-courses">Main Courses</button>
          
<button class="btn" data-category="desserts">Desserts</button>
          
<button class="btn" data-category="drinks">Drinks</button>
        
</div>
        
<div class="grid" id="menu-list">
          
<!-- Menu items will be added here with JavaScript -->
        
</div>
      
</div>
    
</section>
  
</main>
  
<footer id="site-footer"></footer>
  
<script src="js/layout.js"></script>
</body>
</html>
